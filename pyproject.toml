[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viword"
version = "0.1.0"
description = "ViWord-C: word- and tokenizer-aware prompt compression for Vietnamese LLMs (research code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tqdm"]

[project.optional-dependencies]
# Word segmentation. VnCoreNLP is the main segmenter (needs Java); the other two are
# used only for the segmenter-sensitivity analysis (DATN §4.4).
seg = ["py_vncorenlp", "underthesea", "pyvi"]
# Encoder training and scoring.
model = ["torch>=2.1", "transformers>=4.40"]
# Readers (target LLMs).
eval = ["vllm>=0.6", "datasets"]
# Published baselines.
baselines = ["llmlingua>=0.2.2"]
# Teacher LLM through an OpenAI-compatible API (vLLM server or OpenAI).
teacher = ["openai>=1.30"]
dev = ["pytest"]

[tool.setuptools]
packages = ["viword"]

[tool.setuptools.package-data]
viword = ["resources/*.txt"]
